<!DOCTYPE html>
<html lang="es" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti amorcito ❤️</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <button id="theme-toggle" class="float-btn theme-btn">☀️ / 🌙</button>

    <header class="hero">
        <h1>Feliz cumple amor mio, espero te guste este detalle</h1>
        <div id="contador" class="counter-box">
            Calculando tiempo juntos...
        </div>
        <button onclick="lluviaCorazones()" class="btn-love">¡Te extraño! (Haz Click)</button>
    </header>

    <section class="timeline-section">
        <h2>Nuestra Historia ❤️</h2>
        <div class="horizontal-scroll-container">
            <div class="timeline-line"></div> <div id="timeline-content" class="timeline-items">
                </div>
        </div>
    </section>

    <section class="polaroid-section">
        <h2>Momentos (Arrástranos)</h2>
        <div class="table-top" id="mesa">
            <div class="polaroid" style="top: 10%; left: 10%; transform: rotate(-5deg);">
                <img src="img/img1.jpeg" alt="Foto">
                <p>Nuestra locura</p>
            </div>
            <div class="polaroid" style="top: 20%; left: 40%; transform: rotate(10deg);">
                <img src="https://via.placeholder.com/150" alt="Foto">
                <p>Viaje juntos</p>
            </div>
             <div class="polaroid" style="top: 50%; left: 20%; transform: rotate(-12deg);">
                <img src="https://via.placeholder.com/150" alt="Foto">
                <p>Tu sonrisa</p>
            </div>
        </div>
    </section>

    <div class="navigate-btn-container">
        <a href="razones.html" class="btn-main">Ver por qué te amo ❤️</a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
